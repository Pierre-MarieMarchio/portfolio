version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      lint:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'stylelint*',
            'prettier',
          ]
      test:
        patterns: ['vitest', '@vitest/*', 'jsdom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
