# Every pull request and every push to main runs the same checks as a local
# `npm run check`, split into jobs that run side by side. The site is built
# once; the deploy job ships that very artifact to the OVH hosting over SFTP.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Where the site lives. Repository variables override them, so a new domain
# or a VPS needs no change here.
env:
  SITE_URL: ${{ vars.SITE_URL || 'https://pierre-mariemarchio.github.io/portfolio' }}
  BASE_HREF: ${{ vars.BASE_HREF || '/portfolio/' }}

jobs:
  lint:
    name: Format, lint, types, structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck:tools
      - run: npm run lint
      - run: npm run check:structure
      - run: npm run check:comments

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build:
    name: Build and prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href "$BASE_HREF" --define "SITE_URL=\"$SITE_URL\""
      - run: npm run build:finish
      - run: npm run check:prerender
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/portfolio/browser
          include-hidden-files: true
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar tells new code from old by the history.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      # A fork's pull request gets no secret: it is analysed once merged.
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.qualitygate.wait=true

  deploy:
    name: Deploy to OVH
    needs: [lint, build, sonar]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Two deployments racing would leave whichever finishes last.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || 'www/' }}
      SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
    steps:
      # Without SITE_URL the build would ship the GitHub Pages address in its
      # canonical links and its sitemap, and a deploy would publish it.
      - name: Require the site address and the SFTP access
        env:
          SITE_URL_VARIABLE: ${{ vars.SITE_URL }}
        run: |
          missing=""
          [ -n "$SITE_URL_VARIABLE" ] || missing="$missing variable:SITE_URL"
          [ -n "$FTP_SERVER" ] || missing="$missing secret:FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing secret:FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing secret:FTP_PASSWORD"
          [ -n "$SFTP_KNOWN_HOSTS" ] || missing="$missing variable:SFTP_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing, to set in the repository settings:$missing"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Require the .htaccess in the artifact
        run: |
          if [ ! -f site/.htaccess ]; then
            echo "::error::site/.htaccess is missing from the artifact: hidden files were not uploaded"
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends lftp
      # The mirror makes the remote folder the exact copy of the artifact,
      # deleting what it no longer holds. SFTP encrypts the whole session, and
      # the host key is pinned: ssh refuses any host whose key is not in
      # SFTP_KNOWN_HOSTS, so a man in the middle cannot collect the password.
      # The user name is quoted in a file lftp reads; the password stays out of
      # it and out of the command line, lftp takes it from LFTP_PASSWORD
      # (--env-password).
      - name: Mirror the site over SFTP
        run: |
          umask 077
          known_hosts="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$known_hosts"
          quoted_user=$(printf '%s' "$FTP_USERNAME" | sed 's/[\\"]/\\&/g')
          {
            echo "set cmd:fail-exit yes"
            echo "set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts\""
            echo "set net:max-retries 3"
            echo "open --env-password -u \"$quoted_user\" \"sftp://$FTP_SERVER\""
            echo "mirror --reverse --delete --verbose=1 site \"$FTP_REMOTE_DIR\""
          } > "$RUNNER_TEMP/lftp-script"
          LFTP_PASSWORD="$FTP_PASSWORD" lftp -f "$RUNNER_TEMP/lftp-script"
          rm -f "$RUNNER_TEMP/lftp-script" "$known_hosts"
