# Every pull request and every push to main runs the same checks as a local
# `npm run check`, split into jobs that run side by side. The site is built
# once; the deploy job ships that very artifact, and is the only job to
# change the day the site moves off GitHub Pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Where the site lives. Repository variables override them, so a new domain
# or a VPS needs no change here.
env:
  SITE_URL: ${{ vars.SITE_URL || 'https://pierre-mariemarchio.github.io/portfolio' }}
  BASE_HREF: ${{ vars.BASE_HREF || '/portfolio/' }}

jobs:
  lint:
    name: Format, lint, types, structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck:tools
      - run: npm run lint
      - run: npm run check:structure
      - run: npm run check:comments

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build:
    name: Build and prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href "$BASE_HREF" --define "SITE_URL=\"$SITE_URL\""
      - run: npm run check:prerender
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/portfolio/browser
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar tells new code from old by the history.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      # A fork's pull request gets no secret: it is analysed once merged.
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: -Dsonar.qualitygate.wait=true

  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, build, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Two deployments racing would publish whichever finishes last.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # Pages answers an unknown path with 404.html: serving the client shell
      # there lets the router render its own not-found view. .nojekyll keeps
      # Pages from filtering the output through Jekyll.
      - run: |
          cp site/index.csr.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
