name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ github.ref == 'refs/heads/dev' && vars.STAGING_SITE_URL || vars.SITE_URL || 'https://pm-marchio.fr' }}
  BASE_HREF: ${{ github.ref == 'refs/heads/dev' && (vars.STAGING_BASE_HREF || '/staging/') || vars.BASE_HREF || '/' }}

jobs:
  lint:
    name: Format, lint, types, structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck:tools
      - run: npm run lint
      - run: npm run check:structure
      - run: npm run check:comments

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  build:
    name: Build and prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href "$BASE_HREF" --define "SITE_URL=\"$SITE_URL\""
      - run: npm run build:finish
      - run: npm run check:prerender
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/portfolio/browser
          include-hidden-files: true
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.qualitygate.wait=true

  deploy:
    name: Deploy to OVH (${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }})
    needs: [lint, test, build, sonar]
    if: >-
      !cancelled()
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
      && github.event_name != 'pull_request'
      && needs.lint.result == 'success'
      && needs.test.result == 'success'
      && needs.build.result == 'success'
      && (needs.sonar.result == 'success' || (github.ref == 'refs/heads/dev' && needs.sonar.result == 'skipped'))
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
      url: ${{ github.ref == 'refs/heads/dev' && format('{0}/', vars.STAGING_SITE_URL) || vars.SITE_URL }}
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      PRODUCTION_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || 'www' }}
      STAGING_REMOTE_DIR: ${{ vars.STAGING_REMOTE_DIR || 'www/staging' }}
      FTP_REMOTE_DIR: ${{ github.ref == 'refs/heads/dev' && (vars.STAGING_REMOTE_DIR || 'www/staging') || vars.FTP_REMOTE_DIR || 'www' }}
      SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
    steps:
      - name: Require the site address and the SFTP access
        env:
          SITE_URL_VARIABLE: ${{ github.ref == 'refs/heads/dev' && vars.STAGING_SITE_URL || vars.SITE_URL }}
          STAGING_HTPASSWD_PATH: ${{ github.ref == 'refs/heads/dev' && vars.STAGING_HTPASSWD_PATH || '' }}
          STAGING_USER: ${{ github.ref == 'refs/heads/dev' && secrets.STAGING_USER || '' }}
          STAGING_PASSWORD: ${{ github.ref == 'refs/heads/dev' && secrets.STAGING_PASSWORD || '' }}
        run: |
          missing=""
          if [ "$TARGET" = "staging" ]; then
            [ -n "$SITE_URL_VARIABLE" ] || missing="$missing variable:STAGING_SITE_URL"
            [ -n "$STAGING_HTPASSWD_PATH" ] || missing="$missing variable:STAGING_HTPASSWD_PATH"
            [ -n "$STAGING_USER" ] || missing="$missing secret:STAGING_USER"
            [ -n "$STAGING_PASSWORD" ] || missing="$missing secret:STAGING_PASSWORD"
          else
            [ -n "$SITE_URL_VARIABLE" ] || missing="$missing variable:SITE_URL"
          fi
          [ -n "$FTP_SERVER" ] || missing="$missing secret:FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing secret:FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing secret:FTP_PASSWORD"
          [ -n "$SFTP_KNOWN_HOSTS" ] || missing="$missing variable:SFTP_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing, to set in the repository settings:$missing"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Require the .htaccess in the artifact
        run: |
          if [ ! -f site/.htaccess ]; then
            echo "::error::site/.htaccess is missing from the artifact: hidden files were not uploaded"
            exit 1
          fi
      - name: Close the staging
        if: env.TARGET == 'staging'
        env:
          STAGING_HTPASSWD_PATH: ${{ vars.STAGING_HTPASSWD_PATH }}
          STAGING_BASE_HREF: ${{ vars.STAGING_BASE_HREF || '/staging/' }}
        run: |
          if ! [[ "$STAGING_HTPASSWD_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::STAGING_HTPASSWD_PATH must be an absolute path made of letters, digits, . _ - and /, got: $STAGING_HTPASSWD_PATH"
            exit 1
          fi
          if ! [[ "$STAGING_BASE_HREF" =~ ^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*/$ ]]; then
            echo "::error::STAGING_BASE_HREF must be a path under the host root, with a leading and a trailing slash, got: $STAGING_BASE_HREF"
            exit 1
          fi
          sed -i \
            -e "s|^ErrorDocument 404 /404.html\$|ErrorDocument 404 ${STAGING_BASE_HREF}404.html|" \
            -e "s|^  ErrorDocument 404 /en/404.html\$|  ErrorDocument 404 ${STAGING_BASE_HREF}en/404.html|" \
            -e "s|m#^/en/#|m#^${STAGING_BASE_HREF}en/#|" \
            site/.htaccess
          for expected in "ErrorDocument 404 ${STAGING_BASE_HREF}404.html" "ErrorDocument 404 ${STAGING_BASE_HREF}en/404.html" "m#^${STAGING_BASE_HREF}en/#"; do
            if ! grep -qF -- "$expected" site/.htaccess; then
              echo "::error::site/.htaccess no longer has the rule to rewrite for the staging path: $expected"
              exit 1
            fi
          done
          {
            echo "AuthType Basic"
            echo "AuthName \"Staging\""
            echo "AuthUserFile $STAGING_HTPASSWD_PATH"
            echo "Require valid-user"
            echo
            echo "<IfModule mod_headers.c>"
            echo "  Header always set X-Robots-Tag \"noindex, nofollow\""
            echo "</IfModule>"
            echo
            cat site/.htaccess
          } > "$RUNNER_TEMP/htaccess-staging"
          cat "$RUNNER_TEMP/htaccess-staging" > site/.htaccess
          rm -f "$RUNNER_TEMP/htaccess-staging"
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          rm -f site/sitemap.xml
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends lftp
      - name: Install htpasswd
        if: env.TARGET == 'staging'
        run: sudo apt-get install --yes --no-install-recommends apache2-utils
      - name: Generate the staging password file
        if: env.TARGET == 'staging'
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}
        run: |
          printf '%s' "$STAGING_PASSWORD" | htpasswd -niB "$STAGING_USER" > "$RUNNER_TEMP/htpasswd-staging"
          chmod 644 "$RUNNER_TEMP/htpasswd-staging"
      - name: Mirror the site over SFTP
        env:
          STAGING_HTPASSWD_PATH: ${{ vars.STAGING_HTPASSWD_PATH }}
        run: |
          umask 077
          known_hosts="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$known_hosts"
          remote_dir=$(printf '%s' "$FTP_REMOTE_DIR" | sed 's|/*$||')
          if [ -z "$remote_dir" ] || [ "$remote_dir" = "." ] || [ "$remote_dir" = ".." ] || [[ "$remote_dir" == *..* ]]; then
            echo "::error::FTP_REMOTE_DIR must name a folder under the login directory, got: $FTP_REMOTE_DIR"
            exit 1
          fi
          production_dir=$(printf '%s' "$PRODUCTION_REMOTE_DIR" | sed 's|/*$||')
          staging_dir=$(printf '%s' "$STAGING_REMOTE_DIR" | sed 's|/*$||')
          staging_inside=no
          if [[ "$staging_dir" == "$production_dir"/* ]] && [[ "$staging_dir" != *..* ]] && [[ "${staging_dir#"$production_dir"/}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
            staging_inside=yes
          fi
          if [ "$TARGET" = "staging" ] && [ "$staging_inside" != "yes" ]; then
            echo "::error::STAGING_REMOTE_DIR must be a folder inside the production folder $production_dir, got: $STAGING_REMOTE_DIR"
            exit 1
          fi
          exclude=""
          if [ "$TARGET" = "production" ] && [ "$staging_inside" = "yes" ]; then
            staging_relative="${staging_dir#"$production_dir"/}"
            protected=""
            for part in ${staging_relative//\// }; do
              protected="${protected:+$protected/}$part"
              [ -e "site/$protected" ] || break
            done
            exclude="--exclude \"^$(printf '%s' "$protected" | sed 's/[.]/\\&/g')(/|\$)\""
          fi
          quoted_user=$(printf '%s' "$FTP_USERNAME" | sed 's/[\\"]/\\&/g')
          {
            echo "set cmd:fail-exit yes"
            echo "set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts\""
            echo "set net:max-retries 3"
            echo "open --env-password -u \"$quoted_user\" \"sftp://$FTP_SERVER\""
            if [ "$TARGET" = "staging" ]; then
              echo "put \"$RUNNER_TEMP/htpasswd-staging\" -o \"$STAGING_HTPASSWD_PATH\""
              echo "chmod 644 \"$STAGING_HTPASSWD_PATH\""
            fi
            echo "rm -f \"$remote_dir/index.html\""
            echo "mirror --reverse --delete --verbose=1 $exclude site \"$remote_dir\""
          } > "$RUNNER_TEMP/lftp-script"
          LFTP_PASSWORD="$FTP_PASSWORD" lftp -f "$RUNNER_TEMP/lftp-script"
          rm -f "$RUNNER_TEMP/lftp-script" "$known_hosts" "$RUNNER_TEMP/htpasswd-staging"
