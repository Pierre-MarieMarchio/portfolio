# One pipeline: every pull request and every push runs the same gate as a
# local `npm run check`; a push to main then publishes the prerendered site.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Two deployments racing would publish whichever finishes last.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # A project site lives under /<repository>/, and every prerendered page
      # must resolve its scripts and routes from there.
      - run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"
      # Pages answers an unknown path with 404.html: serving the client shell
      # there lets the router render its own not-found view. .nojekyll keeps
      # Pages from filtering the output through Jekyll.
      - run: |
          cp dist/portfolio/browser/index.csr.html dist/portfolio/browser/404.html
          touch dist/portfolio/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser
      - id: deployment
        uses: actions/deploy-pages@v4
