<app-window
  meta="404"
  size="s"
  [heading]="texts().notFound.heading"
  [label]="texts().notFound.label"
  [margin]="76"
  (closed)="closed.emit()"
>
  <div body>
    <h1 tabindex="-1" appViewHeading>{{ texts().notFound.title }}</h1>
    <p>{{ texts().notFound.sentence(count()) }}</p>
  </div>
  <ng-container footer>
    <span class="grow"></span>
    <a [routerLink]="links.index()">{{ texts().notFound.back }}</a>
  </ng-container>
</app-window>
