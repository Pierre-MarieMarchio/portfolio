@if (isLine()) {
  <div #bar class="bar">
    <app-window-grip />
    <h1 tabindex="-1" appViewHeading [id]="headingId" class="line">
      {{ texts().home.name }} · {{ texts().home.trade }}
    </h1>
  </div>
} @else {
  <p class="name"><span aria-hidden="true"></span>{{ texts().home.name }}</p>
  <h1 tabindex="-1" appViewHeading [id]="headingId">
    {{ texts().home.trade }}
  </h1>
  <p class="status">{{ texts().home.status }}</p>
}
