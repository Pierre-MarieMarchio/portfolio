@if (isLine()) {
  <div #bar class="bar">
    <h1 tabindex="-1" appViewHeading [id]="headingId" class="line">
      {{ texts().home.name }} · {{ texts().home.trade }}
    </h1>
    <button
      type="button"
      class="fold"
      [attr.aria-label]="
        isFolded() ? windowTexts().phone.unfold : windowTexts().phone.fold
      "
      [attr.aria-expanded]="!isFolded()"
      (click)="toggleFold()"
    >
      <svg aria-hidden="true" focusable="false" viewBox="2 2 20 20">
        <path [attr.d]="isFolded() ? icons.up : icons.down" />
      </svg>
    </button>
  </div>
} @else {
  <p class="name"><span aria-hidden="true"></span>{{ texts().home.name }}</p>
  <h1 tabindex="-1" appViewHeading [id]="headingId">
    {{ texts().home.trade }}
  </h1>
  <p class="status">{{ texts().home.status }}</p>
}
