@for (entry of entries(); track $index) {
  <button
    appSceneTarget
    type="button"
    class="body"
    aria-hidden="true"
    tabindex="-1"
    [attr.aria-expanded]="entry.expanded"
    (click)="onClick(entry.slug)"
    (mouseenter)="onEnter(entry.slug)"
    (mouseleave)="onLeave()"
    (focus)="onEnter(entry.slug)"
    (blur)="onLeave()"
  >
    <span class="visually-hidden">{{ entry.name }}</span>
  </button>
}
