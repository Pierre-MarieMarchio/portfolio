@for (entry of entries(); track $index) {
  <button
    appSceneTarget
    appHoverFocus
    type="button"
    class="body"
    aria-hidden="true"
    tabindex="-1"
    [attr.aria-expanded]="entry.expanded"
    (click)="onClick(entry.slug)"
    (entered)="onEnter(entry.slug)"
    (exited)="onLeave()"
  >
    <span class="visually-hidden">{{ entry.name }}</span>
  </button>
}
