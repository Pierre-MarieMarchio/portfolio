<app-social-links
  [appLayoutAnchor]="anchor"
  [links]="links()"
  [arrival]="arrival()"
  [appHeldInert]="arrival()"
  [listOnPhone]="false"
  [action]="copyAction()"
  (actioned)="copy()"
>
  <ng-content />
  <app-contact-menu [links]="links()" />
</app-social-links>
<output class="visually-hidden copy-said">
  @if (isCopied()) {
    {{ texts().contactMenu.copied }}
  }
</output>
