<div class="head">
  <span aria-hidden="true" class="square"></span>
  <h2>{{ texts().rule.heading }}</h2>
</div>
<app-card-carousel
  class="cards"
  [items]="markers()"
  [active]="shown()"
  [label]="texts().rule.heading"
  [controls]="controls()"
  (activeChange)="onShown($event)"
  (chosen)="onPicked($event)"
  (pointerdown)="onGrabbed()"
>
  <ng-template let-body>
    <span class="card-title"
      ><span class="accent">{{ body.number }}</span
      ><span>{{ body.title }}</span></span
    >
    <span class="card-fact">{{ body.facts.proof }}</span>
    <span class="card-fact">{{ body.facts.stack }}</span>
  </ng-template>
</app-card-carousel>
<div class="row">
  <div #track class="track">
    <div aria-hidden="true" class="axis"></div>
    <ul>
      @for (marker of markers(); track marker.slug) {
        <li [style.left]="marker.left">
          <button
            type="button"
            [appLayoutAnchor]="lineAnchor"
            [attr.aria-controls]="controls()"
            [attr.aria-label]="marker.label"
            [attr.data-lit]="marker.lit"
            appHoverFocus
            (click)="chosen.emit(marker.slug)"
            (entered)="hoveredChange.emit(marker.slug)"
            (exited)="hoveredChange.emit(null)"
          >
            <span aria-hidden="true" class="dot"></span>
            <span aria-hidden="true" class="stem"></span>
            <span class="name"
              ><span aria-hidden="true" class="number">{{ marker.number }}</span
              ><span aria-hidden="true" class="short">{{
                marker.short
              }}</span></span
            >
          </button>
        </li>
      }
    </ul>
  </div>
  <a class="all" [routerLink]="links.index()">{{ texts().rule.all }}</a>
</div>
@if (line(); as line) {
  <div aria-live="polite" class="reading">
    <p class="title">
      <span class="accent">{{ line.number }}</span
      ><span>{{ line.title }}</span>
    </p>
    <p>{{ line.facts.proof }}</p>
    <p>{{ line.facts.role }}</p>
  </div>
}
