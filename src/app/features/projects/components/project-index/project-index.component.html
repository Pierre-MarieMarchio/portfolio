<app-window
  [heading]="texts().index.heading"
  [label]="texts().index.label"
  size="l"
  [margin]="76"
  scrollKey="index"
  [meta]="meta()"
  [pinned]="pinned()"
  (pinToggled)="pinToggled.emit()"
  (closed)="closed.emit()"
>
  <app-segmented
    toolbar
    [label]="texts().index.families.label"
    [items]="familyItems()"
    (chosen)="familyChange.emit($event)"
  />
  <h1 tabindex="-1" class="landing" appViewHeading>{{ heading() }}</h1>
  <div class="columns" aria-hidden="true">
    @for (column of texts().index.columns; track $index) {
      <span>{{ column }}</span>
    }
  </div>
  <ul body class="rows">
    @for (row of rows(); track row.slug) {
      <li>
        <button
          type="button"
          class="row"
          [attr.aria-pressed]="row.isSelected"
          [attr.aria-label]="row.label"
          [attr.data-selected]="row.isSelected"
          (click)="toggle(row.slug)"
          (mouseenter)="hoveredChange.emit(row.slug)"
          (mouseleave)="hoveredChange.emit(null)"
          (focus)="hoveredChange.emit(row.slug)"
          (blur)="hoveredChange.emit(null)"
        >
          <span
            class="number"
            aria-hidden="true"
            [class.featured]="row.featured"
            >{{ row.number }}</span
          >
          <span class="project">
            <span class="title"
              ><span>{{ row.title }}</span>
              @if (row.isVisited) {
                <span class="read">{{ texts().index.read }}</span>
              }
            </span>
            <span class="stack">{{ row.facts.stack }}</span>
          </span>
          <span class="proof"
            >{{ row.facts.proof
            }}<span class="level">{{ row.level }}</span></span
          >
          <span class="role">{{ row.facts.role }}</span>
        </button>
        @if (row.isSelected) {
          <div class="opened">
            <span aria-hidden="true"></span>
            <span class="opened-body">
              <span class="subject">{{ row.subject }}</span>
              <span class="links">
                <a class="to-sheet" [routerLink]="links.sheet(row.slug)">{{
                  texts().index.openSheet
                }}</a>
                @if (row.link; as link) {
                  <a
                    class="outbound"
                    [href]="link.href"
                    target="_blank"
                    rel="noopener"
                    >{{ link.label }} ↗</a
                  >
                }
              </span>
            </span>
          </div>
        }
      </li>
    }
  </ul>
  <p footer class="state">{{ familySummary() }}</p>
</app-window>
