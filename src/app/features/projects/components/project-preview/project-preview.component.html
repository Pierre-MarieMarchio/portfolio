@if (project(); as project) {
  <app-window
    [label]="texts().preview.label"
    size="m"
    anchor="bottom"
    [heading]="project.title"
    [meta]="meta()"
    [pinned]="pinned()"
    (pinToggled)="pinToggled.emit()"
    (closed)="closed.emit()"
  >
    <app-segmented
      toolbar
      [label]="texts().preview.bodies"
      [items]="choices()"
      (valueChange)="chosen.emit($event)"
    />
    <div body>
      <p class="summary">{{ project.summary }}</p>
      <dl>
        <div>
          <dt>{{ texts().preview.terms.proof }}</dt>
          <dd class="data">{{ project.facts.proof }}</dd>
        </div>
        <div>
          <dt>{{ texts().preview.terms.role }}</dt>
          <dd class="text">{{ project.facts.role }}</dd>
        </div>
        <div>
          <dt>{{ texts().preview.terms.stack }}</dt>
          <dd class="data quiet">{{ project.facts.stack }}</dd>
        </div>
      </dl>
    </div>
    <ng-container footer>
      <p class="tag">{{ project.tag }}</p>
      <a class="to-sheet" [routerLink]="links.sheet(project.slug)">{{
        texts().preview.openSheet
      }}</a>
    </ng-container>
  </app-window>
}
