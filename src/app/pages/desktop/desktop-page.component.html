<!-- Over everything, once per visit; nothing waits for it. -->
<app-intro-card />

<main tabindex="-1" [id]="ids.main">
  <section
    class="scene"
    appHeadBottom
    [id]="ids.home"
    [attr.aria-labelledby]="ids.homeTitle"
    [attr.data-arrival]="arrival()"
  >
    <!--
      First, behind everything: its sky sits under the void, its planets
      above it. Every appPanelAnchor below is text the matter gives way to.
    -->
    <app-desktop-scene
      #object
      [bodies]="planets()"
      [featured]="featuredCount()"
      [view]="sceneView()"
      [sheet]="sheetSlug()"
      [chapter]="station.chapter()"
      [part]="station.section()"
      [preview]="station.preview()"
      [hovered]="station.hovered()"
      [selected]="station.selected()"
      [paused]="animation.paused()"
      [revealed]="arrival() === 'shown'"
      (bodyClicked)="onBodyClicked($event)"
      (bodyHovered)="onBodyHovered($event)"
    />

    @if (station.canStepBack()) {
      <button
        type="button"
        class="void"
        tabindex="-1"
        [attr.aria-label]="desktopTexts().home.void"
        (click)="onVoid()"
      ></button>
    }

    <app-page-bar
      appPanelAnchor="head"
      [items]="navigationItems()"
      [current]="currentRoute()"
      [languages]="languages()"
      [arrival]="arrival()"
    />

    @if (station.view() === 'home') {
      <app-home-title appPanelAnchor [arrival]="arrival()" />
    }

    <div
      #aboutSlot
      class="slot slot--about"
      appStackedWindow="about"
      appPanelAnchor
    >
      @if (station.showsAbout()) {
        <app-about-window
          [pinned]="station.pins().about"
          [part]="station.section()"
          (partChange)="station.chooseSection($event)"
          (pinToggled)="station.togglePin('about')"
          (closed)="station.close('about')"
        />
      }
    </div>

    <div
      #indexSlot
      class="slot slot--index"
      appStackedWindow="index"
      appPanelAnchor
    >
      @if (station.showsList()) {
        <app-project-list
          [pinned]="station.pins().index"
          [selected]="station.selected()"
          [visited]="station.visited()"
          [family]="family()"
          (familyChange)="station.filter($event)"
          (selectedChange)="station.select($event)"
          (hoveredChange)="station.hover($event)"
          (pinToggled)="station.togglePin('index')"
          (closed)="station.close('index')"
        />
      }
    </div>

    <div
      #sheetSlot
      class="slot slot--sheet"
      appStackedWindow="sheet"
      appPanelAnchor="sheet"
    >
      @if (isNotFound()) {
        <app-not-found-window
          [total]="projectCount()"
          (closed)="station.close('sheet')"
        />
      } @else if (sheetSlug(); as slug) {
        <app-project-detail
          [slug]="slug"
          [pinned]="station.pins().sheet"
          [chapter]="station.chapter()"
          (chapterChange)="station.chooseChapter($event)"
          (pinToggled)="station.togglePin('sheet')"
          (closed)="station.close('sheet')"
        />
      }
    </div>

    <div
      #previewSlot
      class="slot slot--preview"
      appStackedWindow="preview"
      appPanelAnchor="preview"
      [id]="ids.previewPanel"
    >
      @if (station.showsPreview()) {
        @if (station.preview(); as slug) {
          <app-project-preview
            [slug]="slug"
            [pinned]="station.pins().preview"
            (chosen)="station.openPreview($event)"
            (pinToggled)="station.togglePin('preview')"
            (closed)="station.close('preview')"
          />
        }
      }
    </div>

    @if (showsRule()) {
      <app-featured-bar
        appPanelAnchor="rule"
        [bodies]="projects.featured()"
        [controls]="ids.previewPanel"
        [hovered]="station.hovered()"
        [reading]="station.lastPreview()"
        [arrival]="arrival()"
        (chosen)="station.openPreview($event)"
        (hoveredChange)="onRuleHovered($event)"
      />
    }
  </section>
</main>

<app-social-links
  appPanelAnchor
  [links]="contactLinks()"
  [showPause]="object.animated()"
  [paused]="animation.paused()"
  [arrival]="arrival()"
  (pauseToggled)="animation.togglePause()"
/>
