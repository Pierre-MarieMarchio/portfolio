<h1>Projets</h1>

<div role="group" aria-label="Filtrer par contexte">
  @for (filter of filters; track filter.value) {
    <button
      type="button"
      [attr.aria-pressed]="family() === filter.value"
      (click)="family.set(filter.value)"
    >
      {{ filter.label }}
    </button>
  }
</div>

@if (manager.isError()) {
  <p role="alert">Les projets n’ont pas pu être chargés.</p>
} @else {
  <p aria-live="polite">{{ visible().length }} projet(s)</p>
  <app-project-list [projects]="visible()" />
}
