<div
  #rail
  class="rail"
  [appScrollRelease]="isActive()"
  (pressed)="press()"
  (released)="letGo($event.speed, $event.pull)"
  (settled)="settle()"
>
  <div #half class="half" aria-hidden="true"></div>
  <div class="lead" aria-hidden="true"></div>
  <div #content class="content"><ng-content /></div>
</div>
