<ul
  #track
  class="scroller"
  role="list"
  (scroll)="onScroll()"
  (scrollend)="settle()"
>
  @for (item of items(); track $index) {
    <li #place [attr.data-current]="$index === current() || null">
      <button
        type="button"
        class="card"
        [attr.aria-controls]="controls()"
        [attr.aria-current]="$index === current() || null"
        (click)="chosen.emit($index)"
      >
        <ng-container
          [ngTemplateOutlet]="card()"
          [ngTemplateOutletContext]="{ $implicit: item, index: $index }"
        />
      </button>
    </li>
  }
</ul>
<app-pager-dots
  [count]="items().length"
  [current]="current()"
  (chosen)="show($event)"
/>
