<canvas #sky class="sky" aria-hidden="true"></canvas>
<div
  #stage
  class="stage"
  [appTurnGesture]="engine()"
  [appZoomGesture]="engine()"
>
  <canvas #matter class="matter" aria-hidden="true"></canvas>
  @if (failed()) {
    <div class="fallback" aria-hidden="true"></div>
  } @else {
    <ng-content />
    @if (labelled() && running()) {
      @for (body of bodies(); track $index) {
        <span #label class="label" aria-hidden="true">{{ body.label }}</span>
      }
    }
    @for (name of figureNames(); track $index) {
      <button
        #figure
        type="button"
        class="figure"
        data-scene-figure
        aria-hidden="true"
        tabindex="-1"
        [attr.aria-label]="name"
        (pointerdown)="onFigurePress($event)"
        (click)="onFigureClick($index, $event)"
      ></button>
    }
  }
</div>
