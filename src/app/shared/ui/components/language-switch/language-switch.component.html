<div
  class="language"
  role="group"
  [attr.aria-label]="texts().pageBar.languages"
>
  @for (language of languages(); track language.lang; let first = $first) {
    @if (!first) {
      <span aria-hidden="true" class="slash">/</span>
    }
    @if (language.current) {
      <span aria-current="true" class="here" [attr.lang]="language.lang">{{
        language.code
      }}</span>
    } @else {
      <a
        class="other"
        [routerLink]="language.route"
        [attr.hreflang]="language.lang"
        [attr.lang]="language.lang"
        [attr.aria-label]="language.name"
        >{{ language.code }}</a
      >
    }
  }
</div>
