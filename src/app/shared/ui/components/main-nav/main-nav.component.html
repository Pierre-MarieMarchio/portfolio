<nav [attr.aria-label]="texts().pageBar.navigation">
  <ul>
    @for (item of items(); track item.route) {
      <li>
        <a
          #entry
          [href]="item.route"
          [attr.aria-current]="item.route === current() ? 'page' : null"
          [attr.data-active]="item.route === current()"
          [attr.data-open]="isOpen(item) ? '' : null"
          [attr.aria-label]="
            isOpen(item) ? item.label + ', ' + texts().pageBar.openWindow : null
          "
          (click)="onTap($event, item)"
          >{{ item.label }}</a
        >
      </li>
    }
  </ul>
</nav>
