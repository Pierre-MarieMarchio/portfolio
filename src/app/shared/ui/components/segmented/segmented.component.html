<ul #list role="group" [attr.aria-label]="name()">
  @for (item of items(); track item.value) {
    <li>
      <button
        type="button"
        [attr.aria-pressed]="item.active"
        [attr.data-active]="item.active"
        [attr.aria-label]="item.aria ?? item.label"
        [title]="item.aria ?? item.label"
        (click)="valueChange.emit(item.value)"
      >
        <span [class.label--wide]="item.phoneLabel">{{ item.label }}</span>
        @if (item.phoneLabel) {
          <span class="phone-label">{{ item.phoneLabel }}</span>
        }
        @if (item.count) {
          <span class="count" aria-hidden="true">{{ item.count }}</span>
        }
      </button>
    </li>
  }
</ul>
