<canvas #sky class="sky" aria-hidden="true"></canvas>
<div class="stage">
  <canvas #matter class="matter" aria-hidden="true"></canvas>
  @if (failed()) {
    <div class="fallback" aria-hidden="true"></div>
  } @else {
    <!--
      Hidden and inert until the engine places them: a target that is not
      drawn yet is out of frame, and no invisible target stays clickable.
    -->
    @if (targets()) {
      @for (entry of entries(); track $index; let rank = $index) {
        <button
          #node
          type="button"
          class="body"
          data-object-body
          aria-hidden="true"
          tabindex="-1"
          [attr.aria-expanded]="entry.expanded"
          (click)="onClick(rank)"
          (mouseenter)="onEnter(rank)"
          (mouseleave)="onLeave()"
          (focus)="onEnter(rank)"
          (blur)="onLeave()"
        >
          <span class="visually-hidden">{{ entry.name }}</span>
        </button>
      }
    }
    <!-- Labels only exist once the engine can place them: not prerendered. -->
    @if (labelled() && running()) {
      @for (entry of entries(); track $index) {
        <span #label class="label" aria-hidden="true">{{ entry.label }}</span>
      }
    }
  }
</div>
