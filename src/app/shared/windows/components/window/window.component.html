<section
  #frame
  class="window"
  [class.pane]="anchor() !== 'bottom'"
  [class.foldable]="isFoldable()"
  [attr.aria-label]="name()"
>
  @if (isFoldable()) {
    <app-window-grip />
  }
  <div #bar class="titlebar" appDoublePress (doublePressed)="onDoublePress()">
    <ng-content select="[before]" />
    <span class="square" aria-hidden="true"></span>
    <h2 tabindex="-1" data-window-title>{{ heading() }}</h2>
    @if (isKeptOpen()) {
      <svg class="kept" aria-hidden="true" viewBox="2 2 20 20">
        <path [attr.d]="keptIcon" />
      </svg>
    }
    <span class="spacer"></span>
    <p class="meta">{{ meta() }}</p>
    <app-window-controls
      [minimizable]="isFramed() && minimizable()"
      [pinned]="isFramed() ? pinned() : null"
      [closable]="closable()"
      [closeLabel]="closeLabel()"
      (minimized)="minimized.emit()"
      (pinToggled)="pinToggled.emit()"
      (closed)="closed.emit()"
    />
  </div>

  <div class="below" [attr.inert]="folded() ? '' : null">
    <div class="toolbar">
      <ng-content select="[toolbar]" />
    </div>
    <ng-content />
    <div
      class="body"
      [appRememberScroll]="scrollKey()"
      [resetOn]="scrollResetOn()"
    >
      <ng-content select="[body]" />
    </div>
    <div class="footer"><ng-content select="[footer]" /></div>
  </div>
</section>
