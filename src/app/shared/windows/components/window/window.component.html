<section
  #frame
  class="window"
  [class.pane]="anchor() !== 'bottom'"
  [class.sheet]="isHeld()"
  [attr.aria-label]="name()"
>
  @if (isHeld()) {
    <button
      type="button"
      class="grip"
      [attr.aria-label]="gripLabel()"
      [attr.aria-expanded]="!folded()"
      (click)="toggleFold()"
    ></button>
  }
  <div #bar class="titlebar" appDoublePress (doublePressed)="onDoublePress()">
    <ng-content select="[before]" />
    @if (isMenuActive()) {
      <button
        type="button"
        class="menu-opener"
        [attr.aria-label]="texts().menu"
        aria-haspopup="menu"
        aria-expanded="false"
        (click)="onMenuClick($event)"
        (keydown)="onMenuKeydown($event)"
      >
        <span class="square" aria-hidden="true"></span>
        <svg class="chevron" aria-hidden="true" viewBox="2 2 20 20">
          <path [attr.d]="chevron" />
        </svg>
        <span class="tip" aria-hidden="true">{{ texts().menu }}</span>
      </button>
    } @else {
      <span class="square" aria-hidden="true"></span>
    }
    <h2 tabindex="-1" data-window-title>{{ heading() }}</h2>
    @if (isKeptOpen()) {
      <svg class="kept" aria-hidden="true" viewBox="2 2 20 20">
        <path [attr.d]="keptIcon" />
      </svg>
    }
    <span class="spacer"></span>
    <p class="meta">{{ meta() }}</p>
    <app-window-controls
      [closable]="closable()"
      [closeLabel]="closeLabel()"
      (closed)="closed.emit()"
    />
  </div>

  <div class="below" [attr.inert]="folded() ? '' : null">
    <div class="toolbar">
      <ng-content select="[toolbar]" />
    </div>
    <ng-content />
    <div
      class="body"
      [appRememberScroll]="scrollKey()"
      [resetOn]="scrollResetOn()"
    >
      <ng-content select="[body]" />
    </div>
    <div class="footer"><ng-content select="[footer]" /></div>
  </div>
</section>
